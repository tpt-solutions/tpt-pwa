# Weekly dependency/vulnerability scans per language, plus the advisory
# databases. Failures open eyes; they don't block feature PRs.
name: Security scans

on:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - ".github/workflows/security.yml"
  workflow_dispatch:

jobs:
  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - working-directory: cortex-daemon
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  cargo-audit:
    name: Rust advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - working-directory: cortex-engine
        run: cargo audit

  pnpm-audit:
    name: JS advisories (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Audit-only job: no shell build, so allow the placeholder sidecar.
      - run: pnpm install --frozen-lockfile
        env:
          CORTEX_SIDECAR_ALLOW_PLACEHOLDER: "1"
      - run: pnpm audit --prod --audit-level high

  version-sync:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All manifests must carry the same version
        run: node scripts/check-version-sync.mjs
