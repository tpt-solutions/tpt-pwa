# Release binaries for the two native pieces (the PWA ships itself): the Go
# daemon and the Rust engine, every supported OS/arch, with SHA256 checksums
# and generated release notes. Runs on version tags alongside the companion
# APK job in release.yml.
#
# A tests-first gate: binaries are only built after the full test suites of
# both projects pass on this exact commit.
name: Release Binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # SLSA provenance attestation signing
  attestations: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest, go: linux/amd64, rust-target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-latest, go: linux/arm64, rust-target: aarch64-unknown-linux-musl }
          - { name: macos-amd64, os: macos-latest, go: darwin/amd64, rust-target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-latest, go: darwin/arm64, rust-target: aarch64-apple-darwin }
          - { name: windows-amd64, os: windows-latest, go: windows/amd64, rust-target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, go: windows/arm64, rust-target: aarch64-pc-windows-msvc }
    env:
      DIST: dist/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Tests-first gate: the exact commit must pass before anything ships.
      - name: Test the daemon
        working-directory: cortex-daemon
        run: go test ./...
      - name: Test the engine
        working-directory: cortex-engine
        run: cargo test --release

      - name: Build cortex-daemon
        working-directory: cortex-daemon
        env:
          GOOS: ${{ contains(matrix.go, 'windows') && 'windows' || contains(matrix.go, 'darwin') && 'darwin' || 'linux' }}
          GOARCH: ${{ endsWith(matrix.go, 'amd64') && 'amd64' || 'arm64' }}
        run: go build -trimpath -ldflags "-s -w" -o "../${{ env.DIST }}/cortex-daemon${{ contains(matrix.go, 'windows') && '.exe' || '' }}" ./cmd/cortex-daemon

      - name: Build cortex-engine
        working-directory: cortex-engine
        run: cargo build --release --target ${{ matrix.rust-target }}
      - name: Stage the engine binary
        shell: bash
        run: |
          EXT="${{ contains(matrix.rust-target, 'windows') && '.exe' || '' }}"
          cp "cortex-engine/target/${{ matrix.rust-target }}/release/cortex-engine$EXT" "${{ env.DIST }}/cortex-engine$EXT"

      - name: Checksums and archive
        shell: bash
        run: |
          cd "${{ env.DIST }}"
          sha256sum cortex-daemon* cortex-engine* > "SHA256SUMS-${{ matrix.name }}.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../tpt-cortex-${{ matrix.name }}.zip" .
            cp "../tpt-cortex-${{ matrix.name }}.zip" ..
          else
            tar czf "../tpt-cortex-${{ matrix.name }}.tar.gz" .
          fi

      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="tpt-cortex-${{ matrix.name }}.$( [ "$RUNNER_OS" = "Windows" ] && echo zip || echo tar.gz )"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "tpt-cortex $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber "$ARCHIVE" "${{ env.DIST }}/SHA256SUMS-${{ matrix.name }}.txt"

      # SLSA provenance for the binaries: verifiable with
      #   gh attestation verify <file> -R tpt-solutions/tpt-pwa
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.DIST }}/cortex-daemon*
            ${{ env.DIST }}/cortex-engine*

  notes:
    name: Attach install instructions
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the release notes point at the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "tpt-cortex $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --notes "Install with one line (see scripts/install.sh / scripts/install.ps1), or download the archive for your platform and verify against its SHA256SUMS file. Android companion APKs are attached by the Release workflow."
