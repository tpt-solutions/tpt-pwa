name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pwa:
    name: PWA (Svelte/TS)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'pwa/') ||
      contains(github.event.pull_request.changed_files, 'pnpm-workspace.yaml') ||
      contains(github.event.pull_request.changed_files, 'package.json') ||
      contains(github.event.pull_request.changed_files, 'tsconfig.json')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: pwa
      - run: pnpm run check
        working-directory: pwa
      - run: pnpm run build
        working-directory: pwa

  cortex-daemon:
    name: Cortex Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-daemon
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'cortex-daemon/') ||
      contains(github.event.pull_request.changed_files, 'go.mod') ||
      contains(github.event.pull_request.changed_files, 'go.sum')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  cortex-engine:
    name: Cortex Engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-engine
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'cortex-engine/') ||
      contains(github.event.pull_request.changed_files, 'Cargo.toml') ||
      contains(github.event.pull_request.changed_files, 'Cargo.lock')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortex-engine
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  cortex-shell:
    name: Cortex Shell (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-shell
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'cortex-shell/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo check

  cortex-android:
    name: Cortex Companion (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-android
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'cortex-android/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug