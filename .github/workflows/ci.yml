name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      daemon: ${{ steps.filter.outputs.daemon }}
      engine: ${{ steps.filter.outputs.engine }}
      shell: ${{ steps.filter.outputs.shell }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pwa:
              - 'pwa/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            daemon:
              - 'cortex-daemon/**'
              - '.github/workflows/ci.yml'
            engine:
              - 'cortex-engine/**'
              - 'cortex-daemon/internal/engineexec/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'cortex-shell/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            android:
              - 'cortex-android/**'
              - '.github/workflows/ci.yml'

  pwa:
    name: PWA (Svelte/TS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: pwa
      - run: pnpm run check
        working-directory: pwa
      - run: pnpm run test
        working-directory: pwa
      - run: pnpm run build
        working-directory: pwa

  cortex-daemon:
    name: Cortex Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-daemon
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  cortex-engine:
    name: Cortex Engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortex-engine
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  cortex-shell:
    name: Cortex Shell (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # pnpm install runs scripts/prepare-sidecar.mjs, which now requires a
      # real daemon binary for the rust host triple — build one first.
      - name: Build cortex-daemon sidecar
        working-directory: cortex-daemon
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          go build -o "bin/cortex-daemon-${TRIPLE}" ./cmd/cortex-daemon
      - run: pnpm install --frozen-lockfile
      - run: cargo check

  cortex-android:
    name: Cortex Companion (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest