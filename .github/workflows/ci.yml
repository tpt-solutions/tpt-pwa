name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      daemon: ${{ steps.filter.outputs.daemon }}
      engine: ${{ steps.filter.outputs.engine }}
      shell: ${{ steps.filter.outputs.shell }}
      android: ${{ steps.filter.outputs.android }}
      companions: ${{ steps.filter.outputs.companions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pwa:
              - 'pwa/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            daemon:
              - 'cortex-daemon/**'
              - '.github/workflows/ci.yml'
            engine:
              - 'cortex-engine/**'
              - 'cortex-engine-wasm/**'
              - 'cortex-daemon/internal/engineexec/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'cortex-shell/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            android:
              - 'cortex-android/**'
              - '.github/workflows/ci.yml'
            companions:
              - 'companions/**'
              - 'tools/create-tpt-companion/**'
              - '.github/workflows/ci.yml'

  pwa:
    name: PWA (Svelte/TS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # --filter keeps the install scoped to the PWA project: a workspace-wide
      # install would run cortex-shell's prepare-sidecar, which (by design)
      # demands a daemon binary this job doesn't build.
      - run: pnpm install --frozen-lockfile --filter tpt-pwa
        working-directory: pwa
      - run: pnpm run check
        working-directory: pwa
      - run: pnpm run test:coverage
        working-directory: pwa
      - run: pnpm run build
        working-directory: pwa

  cortex-daemon:
    name: Cortex Daemon (Go) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The daemon touches real filesystems (fs.write sandbox, queue
        # durability): Windows path semantics deserve their own lane.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cortex-daemon
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -cover ./...

  cortex-engine:
    name: Cortex Engine (Rust) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Parser depth guards and stack behaviour differ per OS: exercise the
        # adversarial suite on all three toolchain hosts.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: cortex-engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cortex-engine
            cortex-engine-wasm
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest' # formatting is host-independent
      - run: cargo clippy -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test
      # The PWA's .ctx playground embeds this crate compiled to WebAssembly
      # (the artifact is committed; `pnpm run engine:build` regenerates it).
      # Verify it still compiles against the wasm target so a language or VM
      # change cannot silently break the playground.
      - run: rustup target add wasm32-unknown-unknown
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check --target wasm32-unknown-unknown
        if: matrix.os == 'ubuntu-latest'
        working-directory: cortex-engine-wasm
      - run: cargo test
        if: matrix.os == 'ubuntu-latest'
        working-directory: cortex-engine-wasm

  cortex-shell:
    name: Cortex Shell (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # pnpm install runs scripts/prepare-sidecar.mjs, which now requires a
      # real daemon binary for the rust host triple — build one first.
      - name: Build cortex-daemon sidecar
        working-directory: cortex-daemon
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          go build -o "bin/cortex-daemon-${TRIPLE}" ./cmd/cortex-daemon
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! validates frontendDist at compile time, so
      # the PWA bundle must exist before cargo check.
      - name: Build the PWA (frontendDist for tauri)
        run: pnpm --filter tpt-pwa build
      # Cargo.toml lives in the src-tauri subpackage, not in cortex-shell/.
      - run: cargo check
        working-directory: cortex-shell/src-tauri

  cortex-android:
    name: Cortex Companion (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
  discover-companions:
    name: Discover scaffolded companions
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.companions == 'true'
    outputs:
      go: ${{ steps.scan.outputs.go }}
      rust: ${{ steps.scan.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          # Convention: `pnpm scaffold -- --dir companions` puts companions here.
          go_list='[]'
          rust_list='[]'
          if [ -d companions ]; then
            go_list=$(find companions -mindepth 2 -maxdepth 2 -name go.mod | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
            rust_list=$(find companions -mindepth 2 -maxdepth 2 -name Cargo.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "go=$go_list" >> "$GITHUB_OUTPUT"
          echo "rust=$rust_list" >> "$GITHUB_OUTPUT"

  companion-go:
    name: Companion (Go) — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [changes, discover-companions]
    if: needs.changes.outputs.companions == 'true' && needs.discover-companions.outputs.go != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.discover-companions.outputs.go) }}
    defaults:
      run:
        working-directory: companions/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  companion-rust:
    name: Companion (Rust) — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [changes, discover-companions]
    if: needs.changes.outputs.companions == 'true' && needs.discover-companions.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.discover-companions.outputs.rust) }}
    defaults:
      run:
        working-directory: companions/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/${{ matrix.name }}
      - run: cargo test
