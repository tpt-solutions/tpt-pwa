[package]
name = "cortex-engine-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-pwa"
description = "WebAssembly build of the cortex-engine .ctx VM for the PWA playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
cortex-engine = { path = "../cortex-engine" }
