[package]
name = "cortex-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "tpt-cortex desktop shell: bundles the PWA and the Go cortex-daemon, registers the tpt:// protocol"

[lib]
name = "cortex_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
