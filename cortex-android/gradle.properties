org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# CI tuning beyond gradle/actions/setup-gradle defaults: the action persists
# ~/.gradle/caches between runs, so the build cache reuses task outputs from
# earlier runs instead of recompiling unchanged sources. The configuration
# cache is deliberately NOT enabled: it must be verified against AGP 8.7 in
# CI first (it fails the build on unsupported tasks by default), and this
# machine has no Android SDK to pre-verify.
org.gradle.caching=true
org.gradle.parallel=true
